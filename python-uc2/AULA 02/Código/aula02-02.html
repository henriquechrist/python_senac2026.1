<!DOCTYPE html>
<html lang="pt-BR">
<!--Inicio do Head-->
<head>
    <title>Modelo de Pagina HTML5</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Uma página de exemplo para demosntrar a estrutura do HTML5 com Bootstrap e Font Awesome">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
         .borda{
            border-color: black;
            border-width: 1px;
            border-style: solid;
            padding-top: 20px;
            padding-bottom: 20px;
        
         }
    </style>

<!--Final do head-->
</head>
<!--Início do Body-->
<body class="container-fluid">

    <section><h1>Exemplo de Uso de Imagem </h1>
    <img src="img/paisagem.jpg"
        width="800"
        height="600"
        alt="Por do Sol - Praia Grande - Arraial do Cabo"
        title="Por do Sol - Praia Grande - Arraial do Cabo">
    <hr>
    </section>

    <section>
        <h4> 2ª imagem</h4>
        <figure>
            <img src="img/bird-8450958_1920.png" height="300"
            alt="Aqui tem um Passáro"
            title="Passarinho">
            <figcaption>Figura 1: Imagem de uma ave                
            </figcaption>
        </figure>

    </section>

    <section>
        <h4> 3ª imagem</h4>
        <figure>
            <img src="img/christmas-6805045_1920.jpg" height="300"
            alt="Natal daqui a pouco"
            title="Presente">
            <figcaption>Figura 2: Imagem do seu presente               
            </figcaption>
        </figure>

        <section>
        <h4> 4ª imagem</h4>
        <figure>
            <img src="img/grafico.jpg" height="300"
            alt="Grafico da População Brasileira"
            title="Grafico de faixa etária da população por grupos">
            <figcaption>Figura 5: Image de um Gráfico de faixa etária da população por grupos               
            </figcaption>
        </figure>

    </section>

    </section>



    <!--NÃO APAGUE A TAG SCRIPT-->
    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>    

<!--Final do Body-->
</body>


</html>
