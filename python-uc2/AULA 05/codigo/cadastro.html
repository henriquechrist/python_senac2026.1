<!DOCTYPE html>
<html lang="pt-BR">
<!--Inicio do Head-->
<head>
    <title>[MUDAR]</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="[MUDAR]">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        .adicionar_borda{
            border-width: 1px;
            border-style: solid;
            border-color: black;}
    </style>

<!--Final do head-->
</head>
<!--Início do Body-->
<body class="bg-secondary">

<!--Area principal do site contem o:
    - Header
    - Main
    - Footer
-->

<div id="div_principal" class="container adicionar_borda bg-light">

    <!--Header da página
        - Logotipo
        - Titulo
        - Menu Principal
        - Login / Logout 
    -->
    <header class="adicionar_borda">
        <div class="row">
            <div class="col-12">
            Logo/Titulo
            </div>
        </div>
        <div class="row">
            <div class="col-9">
            Menu Principal
            </div>

            <div class="col-3">
            Login/Logout
            Cadastrar
            </div>
        </div>


    </header>

    <!--Main da pagina-->
    <main class="adicionar_borda"> 
        
        <form action="cadastro/" method="get" target="_blank">

            <!--Nome Completo-->

            <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome"
                required placeholder="Ex: Roberto Silveira Mendes"
                title="Informe seu nome completo."><br>

            <!--E-mail de login-->
            <label for="e-mail">E-mail:</label>
                <input type="text" id="e-mail" name="e-mail"
                required placeholder="Ex: robsi@gmail.com"
                title="Informe seu e-mail."><br>

            <!--Senha-->
            <label for="senha">Senha:</label>
                <input type="text" id="senha" name="senha"
                required placeholder="Ex: R0bsi@$"
                title="Informe sua senha.">

            <!--Confirmar Senha-->

             <label for="senha2">Confime sua senha:</label>
                <input type="text" id="senha2" name="senha2"
                required placeholder="Ex: R0bsi@$"
                title="Informe sua senha corretamente."><br>
            
            <!--CPF-->

            <label for="CPF">CPF:</label>
                <input type="text" id="CPF" name="CPF"
                required placeholder="Ex: 987.654.123.21"
                title="Informe seu CPF."><br>

            <!--CEP-->

            <label for="CEP">CEP:</label>
                <input type="text" id="CEP" name="CEP"
                required placeholder="Ex: 25660-043"
                title="Informe sua senha corretamente.">

            <!--Logradouro-->

            <label for="Logradouro">Logradouro:</label>
                <input type="text" id="Logradouro" name="Logradouro"
                required placeholder="Ex: Rua José 200"
                title="Informe seu Logradouro."><br>


            <!--Complemento-->

             <label for="Complemento">Complemento:</label>
                <input type="text" id="Complemento" name="Complemento"
                required placeholder="Ex: Casa B"
                title="Informe seu Complemento.">

            <!--Bairro-->

            <label for="Bairro">Bairro:</label>
                <input type="text" id="Bairro" name="Bairro"
                required placeholder="Ex: Silva de Barros"
                title="Informe seu Bairro."><br>

            <!--Cidade-->

            <label for="Cidade">Cidade:</label>
                <input type="text" id="Cidade" name="Cidade"
                required placeholder="Ex: Maricá"
                title="Informe sua cidade.">



            <!--Estado-->

            <label for="Estado">Estado:</label>
                <input type="text" id="Estado" name="Estado"
                required placeholder="Ex: Rio de Janeiro"
                title="Informe seu Estado."><br>


        </form>

        


    </main>
    <!--
        Footer da pagina
        - Menu Secundário
        - Contato
        - Copyright
        - Redes Socias
    -->  
    <footer class="adicionar_borda">
        <div class="row">
            <div class="col-4">
                Menu Secundário
        </div>

        <div class="col-5">
            Contato <br>
            Copyright

        </div>

        <div class="col-3">
            <a href="https://github.com/henriquechrist" target="_blank" title="Acesse meu GitHub!" class="text-dark text-decoration-none"><i class="bi bi-github"></i> GitHub</a><br>
             <a href="https://br.linkedin.com/in/henrique-christ-10915430a" target="_blank" title="Acesse meu LinkedIn!" class="text-dark text-decoration-none" ><i class="bi bi-linkedin"></i> LinkedIn</a>
        </div>

    </footer>

</div>
<!--Final da Div Principal-->




<!--NÃO APAGUE A TAG SCRIPT-->
<!-- Bootstrap JS e dependências -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>    

</body>
<!--Final do Body-->

</html>
